services:
  - type: web
    name: nekotunnel-central
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: SESSION_TTL_SECONDS
        value: "90"
      - key: CLEANUP_INTERVAL_SECONDS
        value: "30"
